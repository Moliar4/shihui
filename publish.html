<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布 · 拾回</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="back" href="index.html">‹</a>
      <span class="title">发布信息</span>
    </header>

    <main class="content">
      <form class="form" id="publishForm" novalidate>
        <!-- TODO(C): 发布表单 —— 寻物/招领切换、物品名称/分类/地点/时间/描述/联系方式，前端+服务端双重校验 -->
        <div class="field" id="field-type">
          <label>类型 <span class="req">*</span></label>
          <div class="type-switch">
            <button type="button" class="on lost" data-type="lost">寻物</button>
            <button type="button" class="found" data-type="found">招领</button>
          </div>
        </div>
        <div class="field">
          <label>物品名称 <span class="req">*</span></label>
          <input type="text" name="title" placeholder="如：校园卡 / 黑色雨伞">
        </div>
        <div class="field">
          <label>物品分类 <span class="req">*</span></label>
          <div class="chips" id="categoryChips">
            <button type="button" class="chip" data-cat="证件卡类">证件卡类</button>
            <button type="button" class="chip" data-cat="钥匙">钥匙</button>
            <button type="button" class="chip" data-cat="雨伞">雨伞</button>
            <button type="button" class="chip" data-cat="水杯">水杯</button>
            <button type="button" class="chip" data-cat="耳机">耳机</button>
            <button type="button" class="chip" data-cat="图书">图书</button>
            <button type="button" class="chip" data-cat="其他">其他</button>
          </div>
        </div>
        <div class="field">
          <label>地点 <span class="req">*</span></label>
          <input type="text" name="location" placeholder="如：教学楼 B 区 302">
        </div>
        <div class="field">
          <label>时间 <span class="req">*</span></label>
          <input type="datetime-local" name="time">
        </div>
        <div class="field">
          <label>详细描述</label>
          <textarea name="description" placeholder="补充物品特征、认领方式等（选填）"></textarea>
        </div>
        <div class="field">
          <label>联系方式 <span class="req">*</span></label>
          <input type="text" name="contact" placeholder="微信号 / 手机号（仅详情页可见）">
        </div>
        <button type="submit" class="btn btn-primary btn-block">立即发布</button>
      </form>
    </main>

    <nav class="tabbar">
      <a class="tabbar-item" href="index.html"><span class="ico">🏠</span>首页</a>
      <a class="tabbar-item active" href="publish.html"><span class="ico">➕</span>发布</a>
      <a class="tabbar-item" href="my.html"><span class="ico">👤</span>我的</a>
    </nav>
  </div>

  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // TODO(C): 发布逻辑（校验 → API.publish → 发布成功反馈 → 跳我的发布）
  </script>
</body>
</html>
