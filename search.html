<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搜索 · 拾回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="dot"></span></div>

    <div class="navbar"><a class="back" href="index.html">‹</a><div class="title">搜索</div><div class="sp"></div></div>

    <div class="searchinput">
      <span class="mg"></span>
      <input id="searchInput" placeholder="输入物品名称搜索">
      <span class="clr" id="searchClear">✕</span>
    </div>

    <!-- 无关键词：搜索历史 + 热门搜索；有关键词：结果列表（B 在此切换渲染） -->
    <div id="searchDefault">
      <div class="block"><h4>搜索历史 <button id="clearHistory">清空</button></h4>
        <div class="chips" id="historyChips">
          <!-- TODO(B): 搜索历史 chips -->
        </div>
      </div>
      <div class="block"><h4>热门搜索</h4></div>
      <div class="hot" id="hotList">
        <!-- TODO(B): 热门搜索列表 -->
      </div>
    </div>

    <div id="searchResult" style="display:none;flex:1;flex-direction:column;overflow:hidden">
      <div class="resultmeta"><span id="resultMeta">找到 <b>0</b> 条相关信息</span><span>综合排序 ⌄</span></div>
      <div class="list" id="resultList" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // TODO(B): 搜索逻辑 —— API.list({q}) + Core.highlight 高亮 + 空状态；搜索历史/热门(localStorage)
</script>
</body>
</html>
